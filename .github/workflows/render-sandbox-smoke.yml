name: Render sandbox smoke test

on:
  push:
    branches:
      - order-fulfillment
    paths:
      - .github/workflows/render-sandbox-smoke.yml
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live service and create sandbox PayPal order
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          base = "https://orders.myclinicprotocols.com"

          def request(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  base + path,
                  data=data,
                  method=method,
                  headers={"Content-Type": "application/json", "Accept": "application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read().decode()
                      return resp.status, json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode()
                  try:
                      parsed = json.loads(body)
                  except Exception:
                      parsed = {"raw": body}
                  return exc.code, parsed

          status, health = request("/health")
          print("HEALTH_STATUS=", status)
          print("HEALTH_BODY=", json.dumps(health, sort_keys=True))
          if status != 200 or health.get("status") != "ok":
              raise SystemExit("health check failed")

          payload = {
              "customerEmail": "sandbox-test@myclinicprotocols.com",
              "package": "protocol",
              "treatments": ["Neuromodulators"],
              "documents": ["Clinical protocol / SOP"],
              "clinic": {"name": "MYCP Sandbox Test Clinic", "state": "Virginia"},
              "providers": ["RN"],
              "oversight": {"notes": "Automated sandbox smoke test only"},
              "details": {"Neuromodulators": {"workflow": "Sandbox smoke test"}},
          }
          status, created = request("/api/checkout/create", "POST", payload)
          print("CREATE_STATUS=", status)
          print("CREATE_ORDER_REFERENCE=", created.get("orderReference"))
          print("CREATE_PAYPAL_ORDER_ID=", created.get("paypalOrderId"))
          print("CREATE_APPROVAL_URL=", created.get("approvalUrl"))
          if status != 200 or not created.get("paypalOrderId") or not created.get("approvalUrl"):
              print("CREATE_BODY=", json.dumps(created, sort_keys=True))
              raise SystemExit("sandbox PayPal order creation failed")

          capture = {
              "orderReference": created["orderReference"],
              "paypalOrderId": created["paypalOrderId"],
          }
          status, result = request("/api/checkout/capture", "POST", capture)
          print("PREAPPROVAL_CAPTURE_STATUS=", status)
          print("PREAPPROVAL_CAPTURE_BODY=", json.dumps(result, sort_keys=True))
          if status == 200 and result.get("status") == "COMPLETED":
              raise SystemExit("SECURITY FAILURE: unapproved sandbox order was fulfilled")
          if status not in (409, 422, 502):
              raise SystemExit(f"unexpected pre-approval capture response: {status}")

          print("SMOKE_TEST=PASS")
          PY
