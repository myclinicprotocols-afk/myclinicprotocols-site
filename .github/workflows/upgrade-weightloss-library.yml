name: Upgrade 2026 weight management library

on:
  push:
    paths:
      - '.github/workflows/upgrade-weightloss-library.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run catalog upgrade
        run: python scripts/upgrade_weightloss.py
      - name: Commit upgrade and remove helpers
        run: |
          git config user.name "MyClinicProtocols Automation"
          git config user.email "myclinicprotocols@gmail.com"
          git rm .github/workflows/upgrade-weightloss-library.yml scripts/upgrade_weightloss.py
          git add index.html order.html assets/mycp-search-support.css
          git commit -m "Expand 2026 weight management protocol library"
          git push origin main
