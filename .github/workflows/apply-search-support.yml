name: Apply search and support enhancements

on:
  push:
    paths:
      - '.github/workflows/apply-search-support.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add search and support assets to pages
        shell: python
        run: |
          from pathlib import Path

          css_tag = '  <link rel="stylesheet" href="assets/mycp-search-support.css?v=20260916">\n'
          js_tag = '  <script src="assets/mycp-search-support.js?v=20260916" defer></script>\n'

          for filename in ('index.html', 'order.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')

              if 'assets/mycp-search-support.css' not in text:
                  text = text.replace('</head>', css_tag + '</head>', 1)

              if 'assets/mycp-search-support.js' not in text:
                  text = text.replace('</body>', js_tag + '</body>', 1)

              path.write_text(text, encoding='utf-8')

      - name: Commit page updates
        shell: bash
        run: |
          if git diff --quiet -- index.html order.html; then
            echo "Pages already contain the enhancements."
            exit 0
          fi
          git config user.name "MyClinicProtocols Automation"
          git config user.email "myclinicprotocols@gmail.com"
          git add index.html order.html
          git commit -m "Add protocol search and customer support"
          git push origin main
