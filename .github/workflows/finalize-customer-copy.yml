# Trigger final sitewide customer copy audit with latest rules
name: Finalize simplified customer journey

on:
  push:
    paths:
      - '.github/workflows/finalize-customer-copy.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Finalize customer-facing copy
        run: python scripts/finalize_customer_copy.py
      - name: Commit final copy
        run: |
          if git diff --quiet; then
            echo "No copy changes to commit"
            exit 0
          fi
          git config user.name "myclinicprotocols-afk"
          git config user.email "myclinicprotocols@gmail.com"
          git add index.html order.html editorial-standards.html assets/mycp-search-support.js med-spa-protocol-templates.html
          git commit -m "Finalize simple customer checkout journey"
          git push origin HEAD:main
