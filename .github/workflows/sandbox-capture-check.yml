name: Sandbox fresh order

on:
  push:
    branches:
      - sandbox-capture-check
    paths:
      - .github/workflows/sandbox-capture-check.yml

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create fresh sandbox order
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://orders.myclinicprotocols.com/api/checkout/create"
          payload = {
              "customerEmail": "sandbox-test@myclinicprotocols.com",
              "package": "protocol",
              "treatments": ["Neuromodulators"],
              "documents": ["Clinical protocol / SOP"],
              "clinic": {"name": "MYCP Sandbox Test Clinic", "state": "Virginia"},
              "providers": ["RN"],
              "oversight": {"notes": "Fresh sandbox end-to-end test"},
              "details": {"Neuromodulators": {"workflow": "Fresh sandbox test"}}
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type": "application/json", "Accept": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              body = resp.read().decode()
              print("STATUS=", resp.status)
              print("BODY=", body)
          PY
