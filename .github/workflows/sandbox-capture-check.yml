name: Sandbox capture check

on:
  push:
    branches:
      - sandbox-capture-check
    paths:
      - .github/workflows/sandbox-capture-check.yml

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture approved sandbox order
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request

          url = "https://orders.myclinicprotocols.com/api/checkout/capture"
          payload = {
              "orderReference": "MYCP-20260913-AAEBD962",
              "paypalOrderId": "4DJ09284CL761283M",
          }
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Content-Type": "application/json", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read().decode()
                  print("STATUS=", resp.status)
                  print("BODY=", body)
          except urllib.error.HTTPError as exc:
              body = exc.read().decode()
              print("STATUS=", exc.code)
              print("BODY=", body)
              raise
          PY
