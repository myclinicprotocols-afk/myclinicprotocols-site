name: Simplify MYCP assistant intro

on:
  push:
    paths:
      - '.github/workflows/simplify-mycp-intro.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simplify intro and refresh cache
        shell: python
        run: |
          from pathlib import Path
          import re

          js_path = Path('assets/mycp-search-support.js')
          text = js_path.read_text(encoding='utf-8')
          old = "Hi! I can answer almost anything about the MYCP website — protocols, pricing, packages, state-specific customization, documents, ordering, delivery, revisions, PayPal checkout, Guides, and support. You can also type a treatment or medication name to see whether we have a matching protocol. Please don’t include patient names or protected health information."
          new = "Hi! How can I help? Ask me anything about MyClinicProtocols, or type a treatment name to find a protocol."
          if old not in text:
              raise SystemExit('Intro text not found')
          js_path.write_text(text.replace(old, new), encoding='utf-8')

          for html in Path('.').rglob('*.html'):
              h = html.read_text(encoding='utf-8')
              updated = re.sub(r'assets/mycp-search-support\.js\?v=[A-Za-z0-9._-]+', 'assets/mycp-search-support.js?v=20260916g', h)
              if updated != h:
                  html.write_text(updated, encoding='utf-8')

      - name: Commit and remove helper
        shell: bash
        run: |
          git config user.name "MyClinicProtocols Automation"
          git config user.email "myclinicprotocols@gmail.com"
          git rm .github/workflows/simplify-mycp-intro.yml
          git add -A
          git commit -m "Simplify MYCP assistant intro"
          git push origin main
