name: Simplify customer order journey

on:
  push:
    paths:
      - '.github/workflows/simplify-order-journey.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update customer-facing copy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
              changed.append(path)

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  print(f'NOTE: exact text not found in {path}: {old[:90]!r}')
                  return 0
              text = text.replace(old, new)
              write(path, text)
              return 1

          def regex(path, pattern, repl, flags=0):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new, n = re.subn(pattern, repl, text, flags=flags)
              if not n:
                  print(f'NOTE: pattern not found in {path}: {pattern[:90]!r}')
                  return 0
              write(path, new)
              return n

          # Homepage process and FAQ
          regex(
              'index.html',
              r'<article class="step"><span>3</span><h3>Review and pay</h3><p>.*?</p></article>',
              '<article class="step"><span>3</span><h3>Review and checkout</h3><p>Confirm your order details and complete checkout.</p></article>'
          )
          regex(
              'index.html',
              r'<article class="step"><span>4</span><h3>Receive your documents</h3><p>.*?</p></article>',
              '<article class="step"><span>4</span><h3>Receive your completed package</h3><p>After checkout, your order is confirmed and we prepare your customized package from the appropriate MYCP master protocols. Delivery is usually within 1-2 hours and may take up to 24 hours.</p></article>'
          )
          regex(
              'index.html',
              r'<details><summary>Can I order more than one protocol\?</summary><p>.*?</p></details>',
              '<details><summary>Can I order more than one protocol?</summary><p>Yes. Customized Protocol orders can include up to 8 treatments, and Complete Treatment Package orders can include up to 5. For larger or ongoing needs, choose 30-Day All Access for $249.</p></details>'
          )
          regex(
              'index.html',
              r'<details><summary>When will I receive my documents\?</summary><p>.*?</p></details>',
              '<details><summary>When will I receive my documents?</summary><p>After payment is confirmed, we prepare your customized package from the appropriate MyClinicProtocols master protocols. Your completed Word and PDF files are delivered by email with a private download link, usually within 1-2 hours and up to 24 hours depending on the package and customization.</p></details>'
          )

          # Order review and checkout page
          replacements = {
              '<h3>Secure checkout</h3>': '<h3>Checkout</h3>',
              '<p>Your intake is securely matched to the verified PayPal payment before any files are released.</p>': '<p>Complete checkout to confirm your order. We will email your confirmation, then prepare your customized package from the appropriate MYCP master protocols.</p>',
              'Continue to Secure PayPal Checkout': 'Checkout',
              'Try Secure Checkout Again': 'Try Checkout Again',
              'Opening secure checkout...': 'Opening checkout...',
              'Redirecting to PayPal...': 'Redirecting to checkout...',
              'Opening PayPal...': 'Opening checkout...',
              'Secure PayPal checkout through MyClinicProtocols.': 'Payment is verified before fulfillment.',
              'Secure checkout is temporarily unavailable.': 'Checkout is temporarily unavailable.',
              '<div class="what-next"><div><b>1. Payment</b>Secure PayPal checkout</div><div><b>2. Initial Version</b>Website download + email backup</div><div><b>3. RN-reviewed version</b>Usually 1-2 hours; up to 24 hours</div><div><b>4. Revisions</b>Two rounds within 14 days; normally 3-5 business days per round</div></div>': '<div class="what-next"><div><b>1. Order confirmed</b>Payment verified and confirmation email sent</div><div><b>2. We prepare your package</b>Built from the appropriate MYCP master protocols</div><div><b>3. Delivery</b>Email + private download, usually within 1-2 hours and up to 24 hours</div><div><b>4. Revisions</b>Two rounds within 14 days; normally 3-5 business days per round</div></div>',
              '<div class="what-next"><div><b>1. Payment</b>Secure PayPal checkout</div><div><b>2. Initial Version</b>Website download + email backup</div><div><b>3. RN-reviewed version</b>Usually 1–2 hours; up to 24 hours</div><div><b>4. Revisions</b>Two rounds within 14 days; normally 3–5 business days per round</div></div>': '<div class="what-next"><div><b>1. Order confirmed</b>Payment verified and confirmation email sent</div><div><b>2. We prepare your package</b>Built from the appropriate MYCP master protocols</div><div><b>3. Delivery</b>Email + private download, usually within 1-2 hours and up to 24 hours</div><div><b>4. Revisions</b>Two rounds within 14 days; normally 3-5 business days per round</div></div>'
          }
          for old, new in replacements.items():
              replace('order.html', old, new)

          # MYCP Assistant
          replace(
              'assets/mycp-search-support.js',
              'The order flow provides an Initial Version by website download with an email backup after verified payment. That is followed by the RN-reviewed final version, normally in 1–2 hours and up to 24 hours depending on the document set. The Initial Version does not replace final clinical approval - your clinic’s qualified reviewer still needs to review and approve the final content.',
              'After checkout, your order is confirmed and MYCP prepares the completed package from the appropriate master protocols. Your Word and PDF files are delivered by email with a private download link, usually within 1-2 hours and up to 24 hours depending on the package. Final clinical approval remains with your clinic’s qualified provider or medical director.'
          )
          replace(
              'assets/mycp-search-support.js',
              'The website’s current workflow is: verified payment → Initial Version by website download and email backup → RN-reviewed version, usually in about 1–2 hours and up to 24 hours depending on the documents/customization → revision period if needed.',
              'The current workflow is simple: choose your protocol, complete the clinic customization form, checkout, receive your order confirmation, then MYCP prepares the completed package from the appropriate master protocols. Delivery is by email with a private download link, usually within 1-2 hours and up to 24 hours depending on the package.'
          )
          replace(
              'assets/mycp-search-support.js',
              'Online checkout is currently set up for packages containing exactly 1, 3, 5, or 10 treatments. For another quantity, contact MYCP for a custom order rather than forcing the checkout.',
              'Customized Protocol orders can include up to 8 treatments. Complete Treatment Package orders can include up to 5. For larger or ongoing needs, 30-Day All Access is $249 and lets one clinic submit eligible protocol requests throughout the active 30-day period.'
          )
          replace(
              'assets/mycp-search-support.js',
              '5) Review your package and complete secure PayPal checkout.\n\nThe website then matches the intake to the verified payment before files are released.',
              '5) Review your package and complete checkout.\n\nAfter payment is verified, your order is confirmed. MYCP then prepares the completed package from the appropriate master protocols and delivers it by email with a private download link.'
          )
          replace(
              'assets/mycp-search-support.js',
              'I can answer most questions about the MYCP website - protocols, pricing, packages, included documents, state-specific customization, provider roles, branding, ordering, PayPal checkout, delivery, the Initial Version, revisions, file formats, custom treatments, Guides, and support.',
              'I can answer most questions about the MYCP website - protocols, pricing, packages, included documents, state-specific customization, provider roles, branding, ordering, checkout, delivery, revisions, file formats, custom treatments, Guides, and support.'
          )

          # Terms should match the actual post-payment workflow
          replace(
              'terms-and-conditions.html',
              'Prices are displayed at checkout and may change for future purchases. Payment must be successfully verified before paid services, downloads, or access codes are activated. Payment processing may be provided by a third-party processor. MyClinicProtocols does not store full payment-card credentials.',
              'Prices are displayed at checkout and may change for future purchases. Payment must be successfully verified before an order is confirmed or an All Access code is activated. Customized protocol packages are prepared after payment and delivered separately by email with a private download link. Payment processing may be provided by a third-party processor. MyClinicProtocols does not store full payment-card credentials.'
          )
          replace(
              'terms-and-conditions.html',
              '<h2 id="delivery">7. Delivery, turnaround, and revisions</h2><p>Delivery times shown on the website are estimates, not guarantees. Turnaround may vary based on request volume, complexity, number of treatments, state-specific review needs, missing information, specialty requests, or technical issues.</p><p>Where a purchase includes revision rounds, revision requests must be submitted within the stated revision window and must relate to the originally purchased treatment or document set. Major scope changes, added treatments, new jurisdictions, or requests outside the original order may require a new purchase.</p>',
              '<h2 id="delivery">7. Delivery, turnaround, and revisions</h2><p>After payment is verified, the customer receives an order confirmation and MyClinicProtocols begins preparing the customized package from the applicable master protocol materials. Completed Word and PDF files are delivered by email with a private download link.</p><p>Most orders are completed within 1-2 hours and may take up to 24 hours depending on request volume, complexity, number of treatments, state-specific review needs, missing information, specialty requests, or technical issues. Delivery times shown on the website are estimates, not guarantees.</p><p>Where a purchase includes revision rounds, revision requests must be submitted within the stated revision window and must relate to the originally purchased treatment or document set. Major scope changes, added treatments, new jurisdictions, or requests outside the original order may require a new purchase.</p>'
          )

          # All Access request portal: set the same expectation after each request.
          p = Path('all-access-request.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "status.textContent=`Request ${result.requestReference} received. We’ll prepare it and follow up at ${email}.`;",
              "status.textContent=`Request ${result.requestReference} received. We’ll prepare it from the appropriate MYCP master protocols and deliver it by email/private download, usually within 1-2 hours and up to 24 hours depending on the request.`;"
          )
          text = text.replace(
              "status.textContent=`Request ${result.requestReference} received. We'll prepare it and follow up at ${email}.`;",
              "status.textContent=`Request ${result.requestReference} received. We'll prepare it from the appropriate MYCP master protocols and deliver it by email/private download, usually within 1-2 hours and up to 24 hours depending on the request.`;"
          )
          write('all-access-request.html', text)

          # Report stale customer-facing phrases so they can be reviewed in the workflow log.
          stale = ['Initial Version', 'instant draft', 'RN-reviewed final version', 'Continue to Secure PayPal Checkout', 'Opening PayPal']
          for file in ['index.html','order.html','checkout-return.html','assets/mycp-search-support.js','terms-and-conditions.html','all-access-request.html']:
              text = Path(file).read_text(encoding='utf-8')
              hits = [phrase for phrase in stale if phrase.lower() in text.lower()]
              if hits:
                  print(f'STALE COPY REMAINS in {file}: {hits}')

          print('Updated:', sorted(set(changed)))
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "myclinicprotocols-afk"
          git config user.email "myclinicprotocols@gmail.com"
          git add index.html order.html assets/mycp-search-support.js terms-and-conditions.html all-access-request.html
          git commit -m "Simplify checkout and fulfillment messaging"
          git push origin HEAD:main
