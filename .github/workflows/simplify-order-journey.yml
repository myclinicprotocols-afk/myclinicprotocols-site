# Run backend fulfillment update after public copy cleanup
name: Simplify customer order journey

on:
  push:
    paths:
      - '.github/workflows/simplify-order-journey.yml'

permissions:
  contents: write

jobs:
  update-fulfillment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update order-fulfillment branch
        run: |
          git fetch origin order-fulfillment
          git worktree add /tmp/mycp-fulfillment origin/order-fulfillment
          python scripts/apply_manual_fulfillment.py /tmp/mycp-fulfillment/fulfillment/service.py
          python -m py_compile /tmp/mycp-fulfillment/fulfillment/service.py
          cd /tmp/mycp-fulfillment
          git switch -C order-fulfillment origin/order-fulfillment
          if git diff --quiet; then
            echo "No fulfillment changes to commit"
            exit 0
          fi
          git config user.name "myclinicprotocols-afk"
          git config user.email "myclinicprotocols@gmail.com"
          git add fulfillment/service.py
          git commit -m "Use simple post-payment preparation flow"
          git push origin HEAD:order-fulfillment
