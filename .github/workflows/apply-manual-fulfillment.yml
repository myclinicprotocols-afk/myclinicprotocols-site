# Trigger backend launch update
name: Apply manual fulfillment

on:
  push:
    paths:
      - '.github/workflows/apply-manual-fulfillment.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - name: Checkout fulfillment branch
        uses: actions/checkout@v4
        with:
          ref: order-fulfillment
          path: target
          fetch-depth: 0
      - name: Update fulfillment service
        run: |
          python source/scripts/apply_manual_fulfillment.py target/fulfillment/service.py
          python -m py_compile target/fulfillment/service.py
      - name: Commit fulfillment changes
        working-directory: target
        run: |
          if git diff --quiet; then
            echo "No fulfillment changes to commit"
            exit 0
          fi
          git config user.name "myclinicprotocols-afk"
          git config user.email "myclinicprotocols@gmail.com"
          git add fulfillment/service.py
          git commit -m "Use simple post-payment preparation flow"
          git push origin HEAD:order-fulfillment
